# Un projet Supabase du plan Free est mis en pause après 7 jours sans activité,
# et ne redevient joignable qu'après une restauration manuelle. Une requête
# quotidienne suffit à l'éviter, y compris pendant les vacances.
#
# Secrets attendus : SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY. Tous deux sont
# publics par nature — ils figurent déjà dans le bundle servi aux visiteurs —
# mais passent par des secrets pour ne pas être versionnés.
name: keep-alive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")
          echo "HTTP $code"
          # 200 attendu, RLS comprise : une réponse vide reste une réponse.
          [ "$code" = "200" ]
